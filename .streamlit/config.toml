# Light dense desk theme for the Streamlit research UI (TradingView-like readability).
# Research UI only — does not change BrokerPort, paper fills, or session math.
# Clocks stay Asia/Dhaka (ui.timezone in config/default.yaml).
# Optional Dark toggle lives in the desk chrome (session only; this file is the default).

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#16c784"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
codeFont = "monospace"
baseFontSize = 17
baseRadius = "sm"
showWidgetBorder = true
borderColor = "#cbd5e1"
headingFontSizes = ["1.5rem", "1.28rem", "1.12rem", "1.0rem", "0.94rem", "0.88rem"]
dataframeHeaderBackgroundColor = "#ffffff"
dataframeBorderColor = "#cbd5e1"
linkColor = "#16c784"
