# Dark dense trading-terminal theme for the Streamlit desk.
# Research UI only — does not change BrokerPort, paper fills, or session math.
# Clocks stay Asia/Dhaka (ui.timezone in config/default.yaml).

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#16c784"
backgroundColor = "#0a0e14"
secondaryBackgroundColor = "#1c2734"
textColor = "#f2f5f8"
font = "sans serif"
codeFont = "monospace"
baseFontSize = 17
baseRadius = "sm"
showWidgetBorder = true
borderColor = "#4a5d73"
headingFontSizes = ["1.5rem", "1.28rem", "1.12rem", "1.0rem", "0.94rem", "0.88rem"]
dataframeHeaderBackgroundColor = "#1c2734"
dataframeBorderColor = "#4a5d73"
linkColor = "#16c784"
