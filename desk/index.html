<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForX — Decision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.childNodes.length) return;
        var text = (event && event.message) || "The desk script failed before it could render.";
        root.style.cssText = "font-family:system-ui,sans-serif;padding:24px;color:#101828;background:#f4f5f7;min-height:100vh";
        root.textContent = "Desk failed to start: " + text;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
