# Forex Research Lab — default config (research only; no live trading)

pairs:
  EURUSD: "EURUSD=X"
  GBPUSD: "GBPUSD=X"
  USDJPY: "USDJPY=X"
  AUDUSD: "AUDUSD=X"
  USDCAD: "USDCAD=X"

# OHLCV defaults
interval: "1h"
period: "2y"

# Labeling
#   triple_barrier (default): first-touch of ATR-scaled High/Low barriers
#     after a next-bar Open fill, within `horizon` bars.
#     BUY  if upper (fill + tp_atr * ATR[t]) is touched first
#     SELL if lower (fill - sl_atr * ATR[t]) is touched first
#     HOLD on timeout or same-bar both-hit (ambiguous path)
#   forward_return (legacy): close-to-close vs label_threshold
label_scheme: triple_barrier
horizon: 8                 # vertical barrier / max holding period (bars)
label_threshold: 0.0005    # used only by forward_return
entry_timing: next_open    # next_open (honest fill) | same_close (legacy)

barrier:
  tp_atr: 2.0              # per-side take-profit distance in ATR units at decision time
  sl_atr: 2.0              # per-side stop distance (long SL = -sl_atr*ATR, short SL = +sl_atr*ATR)
  path: high_low           # high_low | close
  timeout_label: hold      # hold | sign
  cost_aware: false        # if true, barrier wins with TP < spread are labeled HOLD

# Backtest exits: match the label barriers when true
use_tp_sl: true
one_position: true         # no overlapping trades; enter only when flat

# Transaction costs
spread_pips: 1.0           # round-trip-ish cost applied per trade entry
commission_pips: 0.0       # optional extra pips (research; not a broker fee schedule)
pip_size: 0.0001           # 0.01 for JPY pairs (auto-adjusted for *JPY)

# Features (all causal: past/current bar only)
sma_windows: [10, 20, 50]
ema_windows: [12, 26]
rsi_period: 14
atr_period: 14
vol_window: 20
vol_long_window: 100
range_windows: [20, 50]

# Extra causal features (the committed EURUSD joblib ignores unknown columns
# until you retrain). Not walk-forward screened as an upgrade — HTF/cross-pair
# did not earn a default *filter*. pandas-ta / FRED packs stay **off**: EURUSD
# WF showed a ~0.01 PF tick for TA (noise, still PF<1) and a null FRED pack
# with a slightly worse drawdown. See reports/experiments.md.
feature_extras:
  higher_tf: ["4h"]        # resample of the SAME pair CSV; add "1D" if wanted; [] disables
  htf_sma_window: 20
  htf_slope_span: 3        # HTF bars for SMA slope
  session_overlap: true    # sess_ldn_ny feature (London∩NY); not a trade filter
  vol_percentile_window: 100  # 0 = off; causal min-max position of short vol
  cross_pair: null         # e.g. GBPUSD; skipped if that CSV is missing (EURUSD-only safe)
  pandas_ta:
    enabled: false         # extra oscillators (stoch/ADX/BB/CCI/WILLR/ROC/KC); native subset
    backend: native        # native (CI-safe) | pandas_ta if `pip install pandas-ta`
    indicators: [stoch, adx, bbands, cci, willr, roc, kc]
    stoch_k: 14
    stoch_d: 3
    stoch_smooth_k: 3
    adx_period: 14
    bb_window: 20
    bb_std: 2.0
    cci_period: 20
    willr_period: 14
    roc_period: 12
    kc_window: 20
    kc_atr: 1.5
  fred:
    enabled: false         # macro as-of features; skip if cache/download fails
    api_key_env: FRED_API_KEY  # optional; CSV download works without a key
    lag_days: 1            # observation dated D is first used at D+lag (no same-day leak)
    cache_dir: data/fred_cache
    cache_ttl_s: 86400
    timeout_s: 12
    z_window: 60           # rolling z on the *daily* series before hourly ffill
    allow_network: true
    series:                # skip the pair's own FX print (DEXUSEU on EURUSD)
      - DFF                # Fed funds
      - DGS10              # 10y Treasury
      - T10Y2Y             # 10y-2y curve
      - DTWEXBGS           # broad USD goods index (dollar proxy)
      - VIXCLS             # VIX

# Local explanations (research UI). shap is optional; XGBoost pred_contribs is the default.
explain:
  top_n: 5
  ollama: false            # if true, try localhost:11434; ignored when Ollama is down
  ollama_timeout_s: 1.0
  ollama_model: llama3.2

# Walk-forward backtest (time-ordered; no shuffle)
walk_forward:
  train_bars: 2000
  test_bars: 250
  step_bars: 250
  min_train_bars: 500

# Model
model:
  type: xgboost            # xgboost | logistic
  random_state: 42
  class_weight_balanced: true
  compare_logistic: true   # extra walk-forward column; not used for signals
  calibrate: null          # null | isotonic | sigmoid (Platt); fit on last calibrate_frac of train
  calibrate_frac: 0.2
  prune_bottom_frac: 0.0   # drop lowest-gain features using train-fold importance only
  xgboost:
    n_estimators: 160
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 10
    reg_lambda: 1.5
  logistic:
    max_iter: 500
    C: 1.0

# Signal generation (also applied in backtest so research matches the CSV)
signals:
  min_confidence: 0.40     # min P(predicted class) to emit BUY/SELL (else HOLD)
  min_dir_edge: 0.0        # min |P(BUY)-P(SELL)|; 0 keeps the model's own HOLD class
  lookback_bars: 64        # rows written to latest_signals.csv
  sessions: []             # e.g. [london, ny]; empty = all UTC hours
  min_vol_regime: 0.0      # 0 = off; >1 keeps only high-vol vs long-run vol
  min_tp_pips: 0.0         # skip entries whose TP distance is below this (0 = off)
  htf_trend_filter: null   # null/off | 4h | 1D — require HTF SMA slope to agree with BUY/SELL
                           # Default off: session/vol filters hurt EURUSD in prior screens.

# News lane (decision context beside math; not a trade instruction)
news:
  enabled: true
  source: google_news_rss  # free RSS search; no API key
  max_headlines: 8
  timeout_s: 6
  cache_ttl_s: 300         # be polite to Google News; reuse for 5 minutes
  cache_file: data/news_cache.json

# High-impact FX event calendar (UI). Free unofficial Forex Factory weekly JSON.
# Source: https://nfs.faireconomy.media/ff_calendar_thisweek.json (no API key).
# Not an official FF/Fed/BLS feed. Cached locally; fail-soft if offline.
calendar:
  enabled: true
  source: faireconomy_ff_json
  url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  timeout_s: 8
  cache_ttl_s: 1800        # 30 min — be polite; the week dump is not a tick
  cache_file: data/calendar_cache.json
  min_impact: High         # High | Medium | Low (Holiday is always dropped below High)
  max_events: 12
  lookback_hours: 6
  lookahead_hours: 168
  before_minutes: 60
  during_minutes: 15
  after_minutes: 30
  highlight:               # extra-sensitive names for flatten / no-new-open advice
    - NFP
    - Non-Farm
    - FOMC
    - CPI
    - Core PCE
    - Interest Rate
    - Policy Rate
    - Unemployment
    - Employment Change
    - GDP

# Advisory cards next to Paper Buy/Sell. Never auto-submit via BrokerPort.
advice:
  enabled: true
  before_minutes: 60
  during_minutes: 15
  after_minutes: 30
  before_action_open: tighten_sl   # hold | close | tighten_sl
  during_action_open: hold
  after_action_open: hold
  flatten_action: close            # NFP/FOMC/CPI-style names in the before/during window
  tighten_sl_atr: 1.0              # vs barrier.sl_atr (default 2.0) — research SL only

# Trader board freshness (UI). yfinance is unofficial — do not poll faster than 60s.

# Paper practice desk (UI Buy/Sell/Close). Not a live venue.
# Future mt5 / oanda would implement forex_lab.broker.BrokerPort the same way;
# this repo does not store API keys or place live orders.
broker:
  backend: paper
  store: data/paper_broker.json
  default_size: 1.0         # paper units — not a lot-size ticket

board:
  realtime_seconds: 60     # st.fragment period when Realtime is checked
  yf_min_interval_s: 60    # min seconds between yfinance hits per pair
  stale_bars: 2            # STALE if last bar older than N × timeframe in-session
  incremental_period: "5d" # short Yahoo window; merged into the existing CSV
  incremental_min_bars: 20
  sparkline_bars: 48        # cached closes on each watchlist card
  quote:
    last_label: last/mid-ish   # yfinance FX has no bid/ask
    source_note: "yfinance last/mid-ish — not broker bid/ask"
    bar_range_proxy: true      # last High−Low in pips; labeled range, not spread
  sessions:                    # UTC hours, end exclusive; start>end wraps midnight
    asia: [21, 7]              # Sydney/Tokyo so Sunday 21:00 open is not OFF
    london: [7, 16]
    ny: [13, 21]
  mtf_confirm:
    enabled: true
    timeframes: ["4h"]     # causal SMA slope from the same pair CSV (add "1D" if wanted)
    conflict_flash: off    # off | weaken | hold — default off (badge only; HTF gate hurt EURUSD)
    flat_eps: 1.0e-8

# Paths (relative to project root)
paths:
  data_dir: data
  models_dir: models
  signals_dir: signals
  reports_dir: reports
